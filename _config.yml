title: Carlo Scianatico
description: Idee, progetti e articoli su economia, AI e startup
url: "https://www.carloscianatico.com"
baseurl: ""
lang: it
markdown: kramdown
permalink: pretty

timezone: Europe/Rome

# Contatore visite GoatCounter: dopo aver creato l'account su goatcounter.com,
# togli il commento e scrivi il codice scelto (es. se l'indirizzo è
# carlo.goatcounter.com, scrivi: goatcounter: "carlo")
# goatcounter: "IL-TUO-CODICE"

collections:
  en_posts:
    output: true
    permalink: /en/articles/:slug/
  # Build in public: aggiornamenti sui progetti (stessa logica degli articoli)
  updates:
    output: true
    permalink: /projects/aggiornamenti/:name/
  en_updates:
    output: true
    permalink: /en/projects/updates/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: it
  - scope:
      path: ""
      type: en_posts
    values:
      layout: post
      lang: en
  - scope:
      path: ""
      type: updates
    values:
      layout: post
      lang: it
  - scope:
      path: ""
      type: en_updates
    values:
      layout: post
      lang: en

exclude:
  - README.md
  - Gemfile.lock
  - scripts
  - requirements.txt
  - vendor
  - .github
  - .manual_build
